[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/net",
    "crates/auth",
    "crates/install",
    "crates/launch",
    "crates/mods",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/mc-githu/pcl-rs"
authors = ["PCL-RS contributors"]

[workspace.dependencies]
pcl-core = { path = "crates/core" }
pcl-net = { path = "crates/net" }
pcl-auth = { path = "crates/auth" }
pcl-install = { path = "crates/install" }
pcl-launch = { path = "crates/launch" }
pcl-mods = { path = "crates/mods" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha1 = "0.10"
hex = "0.4"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 1
