name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Core libraries + CLI: pure Rust, no webview or Node toolchain needed.
  core:
    name: core / CLI (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

  # Desktop shell (Tauri 2), kept separate because it needs WebView2 tooling.
  desktop:
    name: desktop installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo build --release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: pcl-rs-desktop-windows
          path: src-tauri/target/release/pcl-rs-app.exe

  # Linux proves the library crates stay portable (no Windows-only APIs leaked
  # into core crates).
  linux:
    name: core on linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace
